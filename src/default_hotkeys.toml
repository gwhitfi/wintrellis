# WinTrellis settings. Every hotkey uses the Win key (SUPER); add "shift+" and/or
# "ctrl+" for Shift and Ctrl too, e.g. "ctrl+left" is Win+Ctrl+Left.
#
# Keys: a-z, 0-9, f1-f12, enter, space, escape, tab, backspace, delete,
#       left, right, up, down, home, end, pageup, pagedown
#
# Actions: open_launcher (search the [[launcher]] apps below),
#          close_window, toggle_floating, quit,
#          reload_config, edit_config (opens this file in Notepad),
#          focus_left/right/up/down, swap_left/right/up/down, promote,
#          resize_left/right/up/down (move the focused window's border that way),
#          reset_sizes (all borders back to the middle),
#          workspace_1 .. workspace_5, move_to_workspace_1 .. move_to_workspace_5

[hotkeys]
"t" = "open_launcher" # Custom WinTrellis program launcher
"shift+enter" = "promote" # Focused window moves to the large left window (a floating one joins the layout there)
"shift+q" = "close_window" # Close focused window
"shift+space" = "toggle_floating" # Focused window moves out of snap grid and floats in center of screen
"escape" = "quit" # Exit WinTrellis program
"shift+r" = "reload_config" # Reload settings after making changes, take effect immediately
"shift+e" = "edit_config" # Open hotkeys.toml file to edit custom config

# Change focus window
"left" = "focus_left"
"right" = "focus_right"
"up" = "focus_up"
"down" = "focus_down"

# Swap focus window to another location
"shift+left" = "swap_left"
"shift+right" = "swap_right"
"shift+up" = "swap_up"
"shift+down" = "swap_down"

# Resize focus window, cannot force neighbor window into smaller size than it's minimum
"ctrl+left" = "resize_left"
"ctrl+right" = "resize_right"
"ctrl+up" = "resize_up"
"ctrl+down" = "resize_down"
"ctrl+backspace" = "reset_sizes"

# If multiple monitors, each monitor has separate workspaces
"1" = "workspace_1"
"2" = "workspace_2"
"3" = "workspace_3"
"4" = "workspace_4"
"5" = "workspace_5"

# Move focus window to a new workspace
"shift+1" = "move_to_workspace_1"
"shift+2" = "move_to_workspace_2"
"shift+3" = "move_to_workspace_3"
"shift+4" = "move_to_workspace_4"
"shift+5" = "move_to_workspace_5"

[settings]
gap = 8 # Pixels between tiled windows and around the screen edge
border_color = "#FFFFFF" # Focused window's border color #RRGGBB. Comment out to use the theme's accent
border_style = "overlay" # "overlay" drawn by WinTrellis, works with every app. "native" recolors Windows borders only
border_width = 1
# border_radius = 12 # Overlay border corner radius in pixels, 0 = square. Comment out to match "corners" below.
corners = "default" # square, small, round, or default (windows default)
workspace_bar = true # Bubbles for workspaces 1-5 at the top center of each monitor (click to switch). Tiled windows start below it
bar_margin = 6 # Pixels from the top of the screen to the bar (scaled with the display)
bar_padding = 6 # Pixels around and between the bubbles inside the bar (scaled with the display)
# bar_gap = 8 # Pixels between the bar and the windows below it, like "gap". Comment out to use "gap"
# theme = "catppuccin-mocha" # Colors for the workspace bar, launcher and (if border_color is commented out) the focus border. Comment out for dark gray
#   catppuccin-latte, catppuccin-frappe, catppuccin-macchiato, catppuccin-mocha,
#   rose-pine, rose-pine-moon, rose-pine-dawn, nord, dracula, gruvbox-dark, tokyo-night

[transparency] # Add transparency to unfocused windows (off by default)
#apps = ["discord.exe", "steam.exe"] # Any apps you want transparency
# 0.1 (barely visible) to 1.0 (solid).
# opacity = 0.9

### LAUNCHER SETTINGS ###
# Apps in the launcher (Win+T: type to search, Enter to open)
# "name" display name in launcher
# "open" anything the Run dialog (Win+R) accepts: a program, a full path, or a link
# "key" (optional) open app with dedicated hotkey. Example: Win+B for Firefox

[[launcher]]
name = "Terminal"
open = "wt.exe"
key = "enter"

# More examples: remove the # in front of these lines to use them.
