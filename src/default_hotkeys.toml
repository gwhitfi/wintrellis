# WinTrellis settings. Every hotkey uses the Win key (SUPER); add "shift+" for Shift too.
#
# Keys: a-z, 0-9, f1-f12, enter, space, escape, tab, backspace, delete,
#       left, right, up, down, home, end, pageup, pagedown
#
# Actions: launch_terminal, open_launcher (menu of the [[launcher]] apps below),
#          close_window, toggle_floating, quit,
#          reload_config, edit_config (opens this file in Notepad),
#          focus_left/right/up/down, swap_left/right/up/down, promote,
#          workspace_1 .. workspace_5, move_to_workspace_1 .. move_to_workspace_5

[hotkeys]
"enter" = "launch_terminal"
"t" = "open_launcher"
"shift+enter" = "promote"
"shift+q" = "close_window"
"shift+space" = "toggle_floating"
"escape" = "quit"
"shift+r" = "reload_config"
"shift+e" = "edit_config"

"left" = "focus_left"
"right" = "focus_right"
"up" = "focus_up"
"down" = "focus_down"

"shift+left" = "swap_left"
"shift+right" = "swap_right"
"shift+up" = "swap_up"
"shift+down" = "swap_down"

"1" = "workspace_1"
"2" = "workspace_2"
"3" = "workspace_3"
"4" = "workspace_4"
"5" = "workspace_5"

"shift+1" = "move_to_workspace_1"
"shift+2" = "move_to_workspace_2"
"shift+3" = "move_to_workspace_3"
"shift+4" = "move_to_workspace_4"
"shift+5" = "move_to_workspace_5"

[settings]
# Program Win+Enter opens.
terminal = "wt.exe"
# Pixels between tiled windows and around the screen edge.
gap = 8
# Focused window's border, as #RRGGBB.
border_color = "#F97316"
# "overlay": drawn by WinTrellis, works on every app, `border_width` pixels thick.
# "native": recolors Windows' own 1px border; some apps (Windows Terminal, Discord) ignore it.
border_style = "overlay"
border_width = 3
# Overlay border corner radius in pixels (0 = square). Leave it out to match `corners`.
# border_radius = 12
# Window corners: square, small, round, or default (Windows decides).
corners = "square"

[transparency]
# Windows of these programs turn see-through while they don't have focus.
# Some apps draw incorrectly when see-through (often games and Chromium/Electron apps);
# if one flickers or goes black, take it off the list.
apps = ["discord.exe", "steam.exe"]
# How solid they are while unfocused: 0.1 (barely visible) to 1.0 (solid).
opacity = 0.9

# Apps in the open_launcher menu, in order; press 1-9 (then 0) to pick one.
# `open` is anything the Run dialog (Win+R) accepts: a program, a full path, or a link.
# Remove the # in front of these lines to use them; add more [[launcher]] blocks the same way.
# [[launcher]]
# name = "Firefox"
# open = "firefox.exe"
#
# [[launcher]]
# name = "Steam"
# open = "steam://open/main"
